{% extends "base.html" %}

{% block title %}
    Země: {{ country }}
{% endblock %}

{% block content %}
    <h1 class="text-center">{{ country }}</h1>
    <ul>
        {% for movie in country.movies.all %}
            <li><a href="{% url 'movie' movie.id %}">{{ movie }}</a></li>
        {% endfor %}
    </ul>
    <br>
    <a href="{% url 'country_update' country.id %}" class="btn btn-primary">Upravit</a>
    <a href="{% url 'country_delete' country.id %}" class="btn btn-danger">Smazat</a>
{% endblock %}
